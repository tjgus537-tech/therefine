<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' blob:; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src https://cdn.jsdelivr.net; img-src 'self' data:; connect-src https://tzonflmvtwcbbxqpmhpl.supabase.co; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>THE RE:FINE · 고객동선 CRM</title>
<link rel="icon" href="logo-blue.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--bg:#090c14;--p1:#10141f;--p2:#151a28;--p3:#1b2133;--line:rgba(255,255,255,.07);--tx:#e9ecf5;--sub:#8a92a8;--mute:#5d657b;--blue:#5b7cff;--brand:#1E3FC2;--ok:#3ecf8e;--bad:#ff6b81;--warn:#f5c84c}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 600px at 70% -10%,rgba(46,72,190,.18),transparent 60%),var(--bg);color:var(--tx);font-family:Pretendard,system-ui,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased;letter-spacing:-.01em;min-height:100vh}
a{color:inherit;text-decoration:none}button,input,select{font-family:inherit}
/* 로그인 */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login form{width:100%;max-width:360px;background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.015));border:1px solid var(--line);border-radius:22px;padding:34px 28px;backdrop-filter:blur(14px);box-shadow:0 30px 80px rgba(0,0,0,.4)}
.login img{width:46px;height:46px;border-radius:50%;display:block;margin-bottom:16px}
.login h1{font-size:20px;margin:0 0 4px}.login p{color:var(--sub);margin:0 0 22px;font-size:13px}
.login input{width:100%;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--p1);color:var(--tx);padding:0 14px;margin-bottom:10px;font-size:14px;outline:none;transition:border .2s}
.login input:focus{border-color:var(--blue)}
.login button{width:100%;height:48px;border:0;border-radius:12px;background:linear-gradient(135deg,#4466ff,var(--brand));color:#fff;font-weight:700;font-size:15px;cursor:pointer;margin-top:6px}
.login .err{color:var(--bad);font-size:13px;min-height:18px;margin-top:10px}
/* 앱 */
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:20px 14px;border-right:1px solid var(--line);background:rgba(10,13,22,.7);backdrop-filter:blur(14px);display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}.brand img{width:34px;height:34px;border-radius:10px}
.brand b{display:block;font-size:14px;letter-spacing:.06em}.brand span{font-size:11px;color:var(--sub)}
.search{font-size:12px;color:var(--sub);background:var(--p1);border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:16px}
.side nav{display:flex;flex-direction:column;gap:3px}
.side nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:var(--sub);font-weight:500;transition:background .25s,color .25s}
.side nav a:hover{background:rgba(255,255,255,.03);color:var(--tx)}
.side nav a.on{background:linear-gradient(90deg,rgba(91,124,255,.18),rgba(91,124,255,.04));color:#fff;box-shadow:inset 2px 0 0 var(--blue)}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.sidefoot{margin-top:auto}
.who{display:flex;align-items:center;gap:10px;padding:12px 8px;border-top:1px solid var(--line)}
.who i{width:32px;height:32px;border-radius:50%;background:var(--p3);display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:700}
.who b{display:block;font-size:13px}.who span{font-size:11px;color:var(--sub)}
.hubbtn{display:block;text-align:center;background:linear-gradient(135deg,#4466ff,var(--brand));color:#fff;font-weight:700;border-radius:12px;padding:11px;font-size:13px}
main{min-width:0;padding:0 26px 40px}
.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:14px;padding:16px 0;background:linear-gradient(180deg,var(--bg) 70%,transparent);flex-wrap:wrap}
.crumb{color:var(--sub);font-size:13px}.crumb b{color:var(--tx)}
.periods{display:flex;gap:4px;background:var(--p1);border:1px solid var(--line);border-radius:12px;padding:4px;margin-left:auto;align-items:center;flex-wrap:wrap}
.periods button{border:0;background:none;color:var(--sub);padding:7px 11px;border-radius:9px;cursor:pointer;font-size:13px;transition:all .25s}
.periods button.on{background:var(--blue);color:#fff}
.cust{display:flex;align-items:center;gap:4px;color:var(--mute);font-size:12px;padding:0 4px}
.cust input{background:transparent;border:0;color:var(--sub);font-size:12px;width:118px;color-scheme:dark}
.live{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--sub)}
.live .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(62,207,142,.6);animation:pulse 2.4s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(62,207,142,.5)}70%{box-shadow:0 0 0 8px rgba(62,207,142,0)}100%{box-shadow:0 0 0 0 rgba(62,207,142,0)}}
.live button{border:1px solid var(--line);background:var(--p1);color:var(--sub);border-radius:8px;width:28px;height:28px;cursor:pointer}
#view{transition:opacity .35s}#view.dim{opacity:.55}
.hd{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:8px 0 16px}
.hd h1{font-size:24px;margin:0 0 4px;font-weight:700}.hd p{margin:0;color:var(--sub);font-size:13px}
.grid{display:grid;gap:14px;margin-bottom:14px}
.k4{grid-template-columns:repeat(4,1fr)}.k3{grid-template-columns:repeat(3,1fr)}.g21{grid-template-columns:2fr 1fr}.g12{grid-template-columns:1fr 1.6fr}.g11{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
.card{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.012));border:1px solid var(--line);border-radius:18px;padding:18px 18px 16px;margin-bottom:14px;overflow:hidden;animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
.grid>.card{margin-bottom:0}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card.accent{background:linear-gradient(160deg,rgba(68,102,255,.28),rgba(30,63,194,.08) 60%),var(--p1);border-color:rgba(91,124,255,.3)}
.card.center{text-align:center}
.card.err{color:var(--bad)}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.ch h3{margin:0;font-size:15px;font-weight:600}.sub{color:var(--sub);font-size:12px}.sub.link{color:var(--blue)}
.kc .kt{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--sub);font-size:13px}
.kc .kv{font-size:30px;font-weight:700;margin:12px 0 6px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}.kc .kv small{font-size:14px;color:var(--sub);margin-left:3px;font-weight:500}
.kc .kf{font-size:12px;color:var(--sub)}
.chip{font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;white-space:nowrap}
.chip.up{background:rgba(62,207,142,.12);color:var(--ok)}.chip.down{background:rgba(255,107,129,.12);color:var(--bad)}.chip.mute{background:rgba(255,255,255,.05);color:var(--mute)}.chip.live{background:rgba(62,207,142,.12);color:var(--ok)}
.chartwrap{position:relative}
.chart{width:100%;height:250px;display:block}
.chart .gl{stroke:rgba(255,255,255,.06);stroke-dasharray:3 4}
.ax{fill:var(--mute);font-size:10px}
.lineA{fill:none;stroke:#7d96ff;stroke-width:2.4}
.barb{fill:rgba(62,207,142,.55)}
.tipl{stroke:rgba(255,255,255,.25);stroke-dasharray:3 3}.tipc{fill:#fff;stroke:#5b7cff;stroke-width:3}
.tip{position:absolute;transform:translate(-50%,-120%);background:#fff;color:#11152a;font-size:12px;line-height:1.5;padding:8px 10px;border-radius:10px;pointer-events:none;opacity:0;transition:opacity .2s;white-space:nowrap;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.tip.on{opacity:1}
.lg{display:flex;gap:12px;font-size:12px;color:var(--sub)}.lg i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}.lg .la{background:#7d96ff}.lg .lb{background:var(--ok);height:8px}
.gauge{width:100%;max-width:260px;margin:4px auto 0;display:block}
.gtrack{fill:none;stroke:rgba(255,255,255,.07);stroke-width:14;stroke-linecap:round}
.gval{fill:none;stroke:url(#gg);stroke-width:14;stroke-linecap:round;transition:stroke-dasharray 1.4s cubic-bezier(.2,.8,.2,1)}
.gbig{fill:#fff;font-size:30px;font-weight:700;text-anchor:middle}.gsub{fill:var(--sub);font-size:11px;text-anchor:middle}
.gfoot{font-size:12px;color:var(--sub);margin-top:10px}.dot.g{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:6px}
.donutwrap{display:flex;align-items:center;gap:16px}
.donut{width:128px;flex:none}.dtrack{fill:none;stroke:rgba(255,255,255,.05);stroke-width:16}.dseg{fill:none;stroke-width:16;transform:rotate(-90deg);transform-origin:80px 80px;transition:stroke-dasharray 1s}
.dc{fill:#fff;font-size:28px;font-weight:700;text-anchor:middle}.ds{fill:var(--sub);font-size:11px;text-anchor:middle}
.legend{flex:1;display:grid;gap:7px;font-size:12px;min-width:0}
.legend div{display:grid;grid-template-columns:8px minmax(56px,1fr) auto 32px;align-items:center;gap:8px}.legend i{width:8px;height:8px;border-radius:50%}.legend span{color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.legend em{color:var(--mute);font-style:normal;text-align:right}
.funnel{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.fs{background:var(--p1);border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0}
.fh{display:flex;justify-content:space-between;align-items:center}.fk{font-size:12px;color:var(--sub)}.fr{font-size:11px;color:var(--blue);font-weight:700}
.fv{font-size:24px;font-weight:700;margin:8px 0;font-variant-numeric:tabular-nums}
.fb{height:6px;background:rgba(255,255,255,.05);border-radius:6px;overflow:hidden}.fb i{display:block;height:100%;background:linear-gradient(90deg,#3b5bff,#9db0ff);border-radius:6px;animation:grow 1.2s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{width:0!important}}
.fsub{font-size:11px;color:var(--mute);margin-top:8px;line-height:1.45}
.funnel.big .fv{font-size:30px}
.livefeed{display:grid;gap:4px;max-height:420px;overflow:auto}
.lv{display:grid;grid-template-columns:62px 1fr auto;gap:10px;align-items:center;padding:9px 6px;border-bottom:1px solid var(--line)}
.lv.new{animation:flash 2.4s ease}
@keyframes flash{0%{background:rgba(91,124,255,.22)}100%{background:transparent}}
.lv b{display:block;font-size:13px;font-weight:500}.lv span{font-size:11px;color:var(--sub)}.lv em{font-size:11px;color:var(--mute);font-style:normal}
.st{font-size:11px;font-weight:700;text-align:center;padding:4px 0;border-radius:8px}
.s-expose{background:rgba(255,255,255,.06);color:var(--sub)}.s-judge{background:rgba(91,124,255,.15);color:#9db0ff}.s-review{background:rgba(167,139,250,.15);color:#c4b5fd}.s-book{background:rgba(62,207,142,.15);color:var(--ok)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;color:var(--mute);font-weight:500;font-size:12px;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:hover td{background:rgba(255,255,255,.015)}
.tbl em{color:var(--mute);font-style:normal;font-size:11px}
.tbl.kpi td.big{font-size:16px;font-weight:700}
.card:has(.tbl){overflow-x:auto}
.cdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px}
.pill{font-size:11px;padding:3px 8px;border-radius:999px;background:rgba(91,124,255,.15);color:#9db0ff;white-space:nowrap}.pill.ok{background:rgba(62,207,142,.14);color:var(--ok)}.pill.bad{background:rgba(255,107,129,.14);color:var(--bad)}.pill.mute{background:rgba(255,255,255,.06);color:var(--sub)}
.warn{color:var(--warn)}.okc{color:var(--ok)}.mute{color:var(--sub)}.nowrap{white-space:nowrap}
.empty{color:var(--mute);font-size:13px;padding:18px 4px;text-align:center}
.note{color:var(--mute);font-size:12px;line-height:1.6;margin:12px 0 0}
.hbars{display:grid;gap:10px}
.hb{display:grid;grid-template-columns:110px 1fr 70px;align-items:center;gap:10px;font-size:12px}
.hk{color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hb b{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.ht{height:8px;background:rgba(255,255,255,.05);border-radius:8px;overflow:hidden}.ht i{display:block;height:100%;background:linear-gradient(90deg,#3b5bff,#8fa4ff);border-radius:8px;animation:grow 1.2s cubic-bezier(.2,.8,.2,1) both}
.hours{display:grid;grid-template-columns:repeat(24,1fr);gap:3px;height:120px;align-items:end}
.hcol{height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px}.hcol i{width:100%;background:linear-gradient(180deg,#8fa4ff,#3b5bff);border-radius:4px 4px 2px 2px;animation:growh 1s ease both}.hcol span{font-size:9px;color:var(--mute);height:10px}
@keyframes growh{from{height:0!important}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--p2);color:var(--tx);border-radius:11px;padding:10px 14px;font-weight:600;font-size:13px;cursor:pointer;transition:all .2s}
.btn:hover{border-color:rgba(255,255,255,.18)}.btn.pri{background:linear-gradient(135deg,#4466ff,var(--brand));border-color:transparent;color:#fff}.btn.ghost{background:transparent}.btn.sm{padding:6px 10px;font-size:12px;border-radius:8px}
.btns{display:flex;gap:8px;margin-top:14px}
.form{display:grid;gap:10px}
.form label{display:grid;gap:6px;font-size:12px;color:var(--sub)}.form label small{color:var(--mute)}
.form input,.form select{height:40px;border-radius:10px;border:1px solid var(--line);background:var(--p1);color:var(--tx);padding:0 12px;font-size:13px;outline:none;color-scheme:dark}
.form input:focus,.form select:focus{border-color:var(--blue)}
.out{display:grid;gap:8px;background:var(--p1);border:1px solid var(--line);border-radius:12px;padding:12px}
.out div{display:grid;grid-template-columns:1fr auto;gap:4px 8px;align-items:center}.out span{grid-column:1/-1;font-size:11px;color:var(--mute)}
code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:#b9c6ff;word-break:break-all}code.sm{font-size:10.5px;color:var(--mute)}
.presets{display:grid;gap:8px}
.preset{text-align:left;background:var(--p1);border:1px solid var(--line);border-radius:12px;padding:11px 12px;color:var(--tx);cursor:pointer;display:grid;gap:4px;transition:border .2s}
.preset:hover{border-color:var(--blue)}.preset b{font-size:13px;font-weight:600}.preset code{font-size:11px;color:var(--mute)}
.srows{display:grid;gap:2px}.srows div{display:grid;grid-template-columns:110px 1fr auto;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}.srows span{color:var(--sub)}.srows em{font-style:normal;font-size:12px}
.todo{margin:0;padding-left:18px;display:grid;gap:9px;color:var(--sub);line-height:1.6;font-size:13px}.todo b{color:var(--tx);margin-right:6px}
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:#fff;color:#11152a;font-weight:600;padding:11px 16px;border-radius:12px;opacity:0;transition:all .3s;pointer-events:none;z-index:99}#toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-width:1180px){.k4{grid-template-columns:repeat(2,1fr)}.funnel{grid-template-columns:repeat(3,1fr)}}
@media (max-width:900px){.app{grid-template-columns:1fr}.side{position:fixed;bottom:0;top:auto;height:auto;width:100%;z-index:50;flex-direction:row;padding:6px;border-right:0;border-top:1px solid var(--line)}.brand,.search,.sidefoot{display:none}.side nav{flex-direction:row;justify-content:space-around;width:100%}.side nav a{flex-direction:column;gap:3px;font-size:10px;padding:6px}.side nav a.on{box-shadow:none}main{padding:0 14px 90px}.k3,.g21,.g12,.g11,.g3{grid-template-columns:1fr}.funnel{grid-template-columns:repeat(2,1fr)}.periods{margin-left:0}}
@media print{body{background:#fff;color:#111}.side,.top,.btn,#toast{display:none!important}.app{display:block}main{padding:0}.card{border-color:#ddd;background:#fff;break-inside:avoid}.tbl td,.tbl th{border-color:#eee}}
</style>
</head>
<body>
<div class="login" id="login" style="display:none">
  <form id="lf" autocomplete="on">
    <img src="logo-blue.png" alt="">
    <h1>더리파인 고객동선 CRM</h1>
    <p>관리자 계정으로 로그인하세요.</p>
    <input id="lid" placeholder="아이디" autocomplete="username" required>
    <input id="lpw" type="password" placeholder="비밀번호" autocomplete="current-password" required>
    <button type="submit">로그인</button>
    <div class="err" id="lerr"></div>
  </form>
  <form id="sf" style="display:none" autocomplete="off">
    <img src="logo-blue.png" alt="">
    <h1>관리자 계정 만들기</h1>
    <p>처음 한 번만 하는 설정이에요. 아이디와 비밀번호를 정해 주세요.</p>
    <input id="sid" placeholder="아이디 (영문 소문자·숫자 4~30자)" autocomplete="username" required>
    <input id="spw" type="password" placeholder="비밀번호 (영문+숫자 10자 이상)" autocomplete="new-password" required>
    <input id="spw2" type="password" placeholder="비밀번호 한 번 더" autocomplete="new-password" required>
    <button type="submit">계정 만들기</button>
    <div class="err" id="serr"></div>
  </form>
</div>
<script src="crm.js?v=mwothn1u"></script>
</body>
</html>
